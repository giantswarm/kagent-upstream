suite: Go ADK capability provenance
templates:
  - controller-configmap.yaml
  - harness.yaml
tests:
  - it: leaves unpinned builds without runtime-specific capability claims
    template: controller-configmap.yaml
    asserts:
      - equal:
          path: data.KAGENT_GO_ADK_RELEASE_IMAGE
          value: ""

  - it: uses the release image rather than a custom Harness override
    template: controller-configmap.yaml
    set:
      controller.agentImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      harness.image: custom.example.com/python@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - equal:
          path: data.KAGENT_GO_ADK_RELEASE_IMAGE
          value: ghcr.io/kagent-dev/kagent/golang-adk@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: keeps the built-in workload eligible for its runtime capabilities
    template: harness.yaml
    set:
      controller.agentImage.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      harness.create: true
      harness.snapshotLocation: s3://snapshots/agents
    asserts:
      - equal:
          path: spec.workload.image
          value: ghcr.io/kagent-dev/kagent/golang-adk@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - notExists:
          path: spec.workload.command
      - notExists:
          path: spec.workload.args
