spec:
  env:
    - name: GH_TOKEN
      value: ghu_kagent-credential-injected
    - name: GITLAB_TOKEN
      value: kagent-credential-injected
    - name: GLAB_IS_OAUTH2
      value: "true"
    - name: GITLAB_HOST
      value: gitlab.com
    - name: GIT_CONFIG_COUNT
      value: "1"
    - name: GIT_CONFIG_KEY_0
      value: credential.helper
    - name: GIT_CONFIG_VALUE_0
      value: "!f() { test \"$1\" = get && printf 'username=x-access-token\\npassword=kagent-credential-injected\\n'; }; f"
    - name: GIT_TERMINAL_PROMPT
      value: "0"
