name: Tag and Push

# Fork (giantswarm/kagent-upstream): publishes the dev builds of the
# agent-platform's kagent component from the poc branch. Differences from
# upstream's tag.yaml: GitHub-hosted runners (the org has no self-hosted
# runners), owner-relative registries (ghcr.io/<owner>/kagent/...), no
# PyPI/GitHub-release jobs, the chart's image defaults are stamped with the
# published version, and a push to the dev branch derives the version itself.
on:
  push:
    tags:
    - "v*.*.*"
    branches:
    - poc/agent-platform
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (default: the tag without "v", or a dev version derived from the commit)'
        required: false

permissions:
  contents: read
  packages: write

env:
  # Base of the dev versions built from the branch: upstream main is the 0.11
  # line (latest release 0.10.1, no 0.10.x tag is reachable from main).
  DEV_BASE_VERSION: "0.11.0"
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REPO: ${{ github.repository_owner }}/kagent
  HELM_REPO: oci://ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
    - name: Resolve version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          version="$INPUT_VERSION"
        elif [ "$GITHUB_REF_TYPE" = tag ]; then
          version="${GITHUB_REF_NAME#v}"
        else
          # Dev version in the schema giantswarm's gitsemver emits today:
          #   <base>-dev.<branch lowercased, [a-z0-9-]>.<committer date UTC YYYY-MM-DD>.<HH-MM-SS>.h<sha7>
          # Consumers select the channel with a Flux semverFilter on the branch
          # part (`.*-dev\.poc-agent-platform\..*`); the timestamp keeps semver
          # order across rebuilds. When gitsemver moves to the RFC schema
          # `<base>-b<crc32(branch) hex8>t<YYYYMMDDHHMMSS>c<sha7>`, change this
          # line and the consumers' filter together.
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d.%H-%M-%S "$GITHUB_SHA")
          version="${DEV_BASE_VERSION}-dev.${branch}.${stamp}.h${GITHUB_SHA:0:7}"
        fi
        echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

  push-images:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image:
          - controller
          - ui
          - golang-adk
          - claude-harness
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        name: kagent-builder-v0.23.0
        platforms: linux/amd64,linux/arm64
        version: v0.23.0
        use: 'true'
    - name: Build and push ${{ matrix.image }}
      env:
        DOCKER_BUILD_ARGS: "--push --platform linux/amd64,linux/arm64"
        DOCKER_BUILDER: "docker buildx build"
      # apk.cgr.dev intermittently refuses some of the parallel anonymous
      # fetches from hosted runners (HTTP 403, reported by apk as "Permission
      # denied"). The builder keeps the finished stages, so a retry repeats
      # only the failed step.
      run: |
        for attempt in 1 2 3; do
          make build-${{ matrix.image }} && exit 0
          echo "::warning::build attempt ${attempt} failed, retrying"
          sleep $((attempt * 30))
        done
        exit 1

  push-helm-chart:
    needs:
    - version
    - push-images
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Helm charts
      run: |
        # Point the chart's defaults at the images published above and record
        # the version as appVersion. The tag has to be an explicit default: the
        # chart falls back to .Chart.Version, which helm-controller extends with
        # `+<digest>` — not a valid image tag. sed keeps the file's formatting
        # (`helm show values` is documentation); the checks make a missed anchor
        # fail the job instead of shipping upstream's defaults.
        sed -i \
          -e "s|^tag: \"\"$|tag: \"${VERSION}\"|" \
          -e "s|^\(\s*repository: \)kagent-dev/kagent/|\1${DOCKER_REPO}/|" \
          helm/kagent/values.yaml
        grep -q "^tag: \"${VERSION}\"$" helm/kagent/values.yaml
        test "$(grep -c "^\s*repository: ${DOCKER_REPO}/" helm/kagent/values.yaml)" -eq 3
        for chart in kagent kagent-crds; do
          printf 'appVersion: %s\n' "${VERSION}" >> "helm/${chart}/Chart-template.yaml"
        done
        make helm-publish

  record:
    # Fork: the ledger (FORK.md). Records the published version, the commit, the
    # upstream pin and every digest — in the run summary and as a row of
    # builds.md on the `ledger` branch. Runs only after both pushes succeeded.
    needs:
    - version
    - push-images
    - push-helm-chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Resolve digests and the upstream pin
      id: facts
      run: |
        digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
        for image in controller ui golang-adk claude-harness; do
          echo "${image}=$(digest "${DOCKER_REGISTRY}/${DOCKER_REPO}/${image}:${VERSION}")" | tee -a "$GITHUB_OUTPUT"
        done
        for chart in kagent kagent-crds; do
          echo "chart_${chart//-/_}=$(digest "${DOCKER_REGISTRY}/${DOCKER_REPO}/helm/${chart}:${VERSION}")" | tee -a "$GITHUB_OUTPUT"
        done
        git remote add upstream https://github.com/kagent-dev/kagent.git
        git fetch -q upstream main
        pin=$(git merge-base "$GITHUB_SHA" upstream/main)
        echo "pin=${pin}" | tee -a "$GITHUB_OUTPUT"
        echo "pin_date=$(git show -s --format=%cs "$pin")" | tee -a "$GITHUB_OUTPUT"

    - name: Record
      env:
        LEDGER_TOKEN: ${{ github.token }}
        F: ${{ toJSON(steps.facts.outputs) }}
      run: |
        row="| $(date -u +'%Y-%m-%d %H:%M') | \`${VERSION}\` | \`${GITHUB_SHA:0:7}\` | \`$(jq -r .pin <<< "$F" | cut -c1-7)\` ($(jq -r .pin_date <<< "$F")) | \`$(jq -r .controller <<< "$F")\` | \`$(jq -r .ui <<< "$F")\` | \`$(jq -r '.["golang-adk"]' <<< "$F")\` | \`$(jq -r '.["claude-harness"]' <<< "$F")\` | \`$(jq -r .chart_kagent <<< "$F")\` | \`$(jq -r .chart_kagent_crds <<< "$F")\` | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
        {
          echo "## Published ${VERSION}"
          echo
          echo "Commit \`${GITHUB_SHA:0:7}\`, upstream pin \`$(jq -r .pin <<< "$F" | cut -c1-7)\` ($(jq -r .pin_date <<< "$F"))."
          echo
          echo "| artifact | digest |"
          echo "|---|---|"
          for image in controller ui golang-adk claude-harness; do
            echo "| \`${DOCKER_REGISTRY}/${DOCKER_REPO}/${image}:${VERSION}\` | \`$(jq -r --arg k "$image" '.[$k]' <<< "$F")\` |"
          done
          echo "| \`oci://${DOCKER_REGISTRY}/${DOCKER_REPO}/helm/kagent:${VERSION}\` | \`$(jq -r .chart_kagent <<< "$F")\` |"
          echo "| \`oci://${DOCKER_REGISTRY}/${DOCKER_REPO}/helm/kagent-crds:${VERSION}\` | \`$(jq -r .chart_kagent_crds <<< "$F")\` |"
        } >> "$GITHUB_STEP_SUMMARY"
        scripts/fork/ledger-append.sh builds.md "$row"
