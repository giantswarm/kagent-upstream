name: probe 508 (do not merge)
on:
  pull_request:
    branches: [giantswarm]
jobs:
  ui-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
      - run: corepack enable
      - working-directory: ./ui
        run: yarn install --immutable
      - working-directory: ./ui
        run: yarn playwright install --with-deps chromium firefox
      # The suite's own load (two engines, two workers), the flaky specs repeated,
      # every failed attempt keeping its full trace.
      - working-directory: ./ui
        env:
          CI: "true"
        run: >
          yarn playwright test --project firefox --project chromium --retries 0
          --repeat-each 6 --trace retain-on-failure
          playwright/tests/chat/agent-rail.spec.ts playwright/tests/agents/agent-page.spec.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.shard }}
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 3
