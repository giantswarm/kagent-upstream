name: Fork closing keywords

# Fork (giantswarm/kagent-upstream): a pull request closes no issue by keyword
# (scripts/fork/closing-keywords.sh). A workflow of its own, so an edit of the
# description re-runs this check alone.
on:
  pull_request:
    branches: [giantswarm]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: fork-closing-keywords-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closing-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # HEAD^1 of the merge is the line, HEAD^2 the pull request's head.
          fetch-depth: 0
      - name: Fixture runs of the check
        run: scripts/fork/closing-keywords_test.sh
      - name: No issue closed by keyword
        run: |
          {
            jq -r '.pull_request.title, (.pull_request.body // "")' "${GITHUB_EVENT_PATH}"
            git log --format=%B HEAD^1..HEAD^2
          } | scripts/fork/closing-keywords.sh
